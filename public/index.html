<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Zongheng 縱橫</title>
<meta name="description" content="縱橫 Zongheng: a two-player Warring States card-driven strategy game, Qin against Chu. Solo against a bot, or a room with a friend.">
<link rel="canonical" href="https://games.csiesheep.com/zongheng/">
<meta name="theme-color" content="#0c0b0a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="landing-desktop.css">
<link rel="stylesheet" href="ui-states.css">
<link rel="stylesheet" href="opening.css">
</head>
<body class="landing-body">
<div class="desktop-frame" aria-hidden="true">
  <div class="desktop-tex-qin"></div>
  <div class="desktop-tex-chu"></div>
  <div class="desktop-vignette"></div>
  <div class="desktop-seam"></div>
</div>
<div class="landing-page">
  <div class="hero">
    <header class="bar landing-bar">
      <a class="hub" href="https://games.csiesheep.com/" data-t="nav.hub"></a>
      <div class="bar-right">
        <span id="audioBtnSlot"></span>
        <a class="rules" href="rules.html" data-t="landing.rulesShort"></a>
        <button id="langBtn" class="langBtn" type="button" data-t="nav.lang"></button>
      </div>
    </header>
    <div class="sides">
      <a id="btnQin" class="side-tap qin" href="play.html?play&amp;side=qin" aria-label="Play as Qin, the Horizontal">
        <img class="side-img" src="art/ui/qin.jpg" alt="">
        <span class="side-shade" aria-hidden="true"></span>
        <span class="side-content">
          <span class="side-glyph" lang="zh-Hant" aria-hidden="true">秦</span>
          <span class="side-text">
            <span class="side-headline" data-t="side.qin.headline"></span>
            <span class="side-sub" data-t="side.qin.sub"></span>
          </span>
        </span>
        <span class="side-cta" data-t="side.qin.cta"></span>
      </a>
      <a id="btnChu" class="side-tap chu" href="play.html?play&amp;side=chu" aria-label="Play as Chu, the Vertical">
        <img class="side-img" src="art/ui/chu.jpg" alt="">
        <span class="side-shade" aria-hidden="true"></span>
        <span class="side-content">
          <span class="side-glyph" lang="zh-Hant" aria-hidden="true">楚</span>
          <span class="side-text">
            <span class="side-headline" data-t="side.chu.headline"></span>
            <span class="side-sub" data-t="side.chu.sub"></span>
          </span>
        </span>
        <span class="side-cta" data-t="side.chu.cta"></span>
      </a>
      <h1 id="hero" lang="zh-Hant" aria-hidden="true">縱橫</h1>
    </div>
  </div>

  <div class="controls">
    <div class="row" id="ctaRow">
      <a id="btnResume" class="ctl-btn ctl-fill" href="play.html?resume" hidden>
        <svg class="ctl-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 3.2v9.6l7.5-4.8z"/></svg>
        <span class="ctl-label" data-t="landing.resume"></span>
      </a>
      <a id="btnRoom" class="ctl-btn ctl-fill" href="play.html" hidden>
        <svg class="ctl-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 3.2v9.6l7.5-4.8z"/></svg>
        <span class="ctl-label"></span>
      </a>
      <a id="btnTutorial" class="ctl-btn" href="play.html?tutorial">
        <svg class="ctl-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 3.5h4.5c.8 0 1.5.7 1.5 1.5v8c0-.8-.7-1.5-1.5-1.5H2zM14 3.5H9.5c-.8 0-1.5.7-1.5 1.5v8c0-.8.7-1.5 1.5-1.5H14z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span class="ctl-label" data-t="tutorial.button"></span><span class="tut-btn-dot" id="tutEntryDot" hidden></span>
      </a>
    </div>
    <div class="row">
      <button id="btnCreate" class="ctl-btn" type="button">
        <svg class="ctl-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.6 7.6a2.3 2.3 0 1 0 0-4.6 2.3 2.3 0 0 0 0 4.6zM1.5 13c.4-2.3 2-3.5 4.1-3.5s3.7 1.2 4.1 3.5M10.8 7.8a1.9 1.9 0 1 0-.6-3.7M11.6 9.7c1.6.2 2.6 1.3 2.9 3.3" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <span class="ctl-label" data-t="landing.create"></span>
      </button>
      <label for="joinCode" class="sr" data-t="landing.code"></label>
      <input id="joinCode" maxlength="4" autocapitalize="characters" spellcheck="false">
      <button id="btnJoin" class="ctl-btn ctl-join" type="button" data-t="landing.join"></button>
    </div>
  </div>
</div>
<script type="module" src="landing.js"></script>
</body>
</html>
