<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Zongheng 縱橫</title>
<meta name="description" content="縱橫 Zongheng: a two-player Warring States card-driven strategy game, Qin against Chu. Solo against a bot, or a room with a friend.">
<link rel="canonical" href="https://games.csiesheep.com/zongheng/">
<meta name="theme-color" content="#1c1a17">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a class="hub" href="https://games.csiesheep.com/" data-t="nav.hub"></a>
  <span id="barMid"></span>
  <span><a class="hub" id="rulesLink" href="rules.html" data-t="nav.rules"></a> <button id="langBtn" type="button" data-t="nav.lang"></button></span>
</header>

<main id="landing" class="view">
  <h1 id="hero"></h1>
  <p class="tagline" id="tagline"></p>
  <p class="about" id="about"></p>
  <div class="actions">
    <a id="btnResume" class="primary" href="play.html?resume" data-t="landing.resume" hidden></a>
    <a id="btnRoom" class="primary" href="play.html" hidden></a>
    <a id="btnPlay" class="primary" href="play.html?play" data-t="landing.play"></a>
    <div class="row">
      <label for="landName" class="sr" data-t="landing.name"></label>
      <input id="landName" maxlength="16" spellcheck="false">
    </div>
    <div class="row">
      <button id="btnCreate" type="button" data-t="landing.create"></button>
      <label for="joinCode" class="sr" data-t="landing.code"></label>
      <input id="joinCode" maxlength="4" autocapitalize="characters" spellcheck="false">
      <button id="btnJoin" type="button" data-t="landing.join"></button>
    </div>
    <a href="rules.html" class="link" data-t="landing.rulesLink"></a>
  </div>
</main>

<footer class="credit" id="credit"></footer>
<script type="module" src="landing.js"></script>
</body>
</html>
