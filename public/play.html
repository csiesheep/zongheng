<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Zongheng 縱橫 · the table</title>
<meta name="description" content="縱橫 Zongheng: the game table.">
<link rel="canonical" href="https://games.csiesheep.com/zongheng/">
<meta name="theme-color" content="#1c1a17">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="screens.css">
<link rel="stylesheet" href="desktop.css">
<link rel="stylesheet" href="advisor.css">
<link rel="stylesheet" href="tutorial.css">
<link rel="stylesheet" href="ui-states.css">
<link rel="stylesheet" href="oppmove.css">
</head>
<body>
<div class="d-frame" aria-hidden="true">
  <div class="d-tex d-tex-a"></div>
  <div class="d-tex d-tex-b"></div>
  <div class="d-vignette"></div>
</div>
<div class="page-card" id="pageCard">
<header class="bar">
  <a class="hub back" id="backLink" href="./"><span class="back-chevron" aria-hidden="true">‹</span><span class="back-label"></span></a>
  <span id="barMid"></span>
  <span class="bar-right"><span id="audioBtnSlot"></span><button id="logToggle" type="button" class="small no-tap-sound" aria-expanded="false"></button><span id="advisorSlot"></span><a class="hub" id="rulesLink" href="rules.html" target="_blank" rel="noopener" data-t="nav.rules"></a> <button id="langBtn" type="button" data-t="nav.lang"></button></span>
</header>

<main id="lobby" class="view" hidden>
  <div id="lobbyGate" class="gate" hidden>
    <h2 data-t="lobby.title"></h2>
    <p class="about" data-t="lobby.gateHint"></p>
    <form id="lobbyGateForm">
      <div class="field">
        <label for="lobbyName" class="field-label" data-t="landing.name"></label>
        <input id="lobbyName" class="gate-input" maxlength="16" spellcheck="false" autocomplete="off">
      </div>
      <button id="lobbyGateGo" type="submit" class="primary" data-t="lobby.join"></button>
    </form>
  </div>
  <div id="lobbyRoom">
    <h2 data-t="lobby.title"></h2>
    <div class="code-row">
      <div class="code" id="lobbyCode"></div>
      <button id="lobbyCopy" type="button" data-t="lobby.copy"></button>
    </div>
    <p class="about" id="lobbyHint"></p>
    <div id="lobbySeats" class="seats"></div>
    <div class="field" id="lobbyLevelField" hidden><div class="label" data-t="setup.level"></div><div class="seg" id="lobbyLevel"></div></div>
    <div class="lobby-row" id="lobbySecondary"></div>
    <div id="lobbyChat" class="lobby-chat" aria-live="polite"></div>
    <form id="lobbyChatForm" class="lobby-chat-form">
      <label for="lobbyChatIn" class="sr" data-t="lobby.say"></label>
      <input id="lobbyChatIn" maxlength="200" autocomplete="off">
      <button type="submit" class="small" data-t="buttons.send"></button>
    </form>
    <div class="actions" id="lobbyActions"></div>
    <p class="soon" id="lobbyErr" hidden></p>
  </div>
</main>

<main id="setup" class="view setup-view" hidden>
  <h1 class="setup-h1" data-t="setup.title"></h1>
  <div class="field"><span class="field-label" data-t="setup.side"></span><div class="tiles" id="sideTiles"></div></div>
  <div class="field"><span class="field-label" data-t="setup.level"></span><div class="pills" id="segLevel"></div></div>
  <div class="field">
    <label for="setupName" class="field-label" data-t="landing.name"></label>
    <input id="setupName" maxlength="16" spellcheck="false">
  </div>
  <div class="setup-footer">
    <button id="btnBack" data-t="setup.back"></button>
    <button id="btnStart" class="primary" data-t="setup.start"></button>
  </div>
  <p class="setup-desc" id="setupDesc"></p>
</main>

<main id="table" class="view table-view" hidden>
  <section class="topbar" id="topbar"></section>
  <section class="map" id="map"><div class="map-inner" id="mapInner"></div><div class="hit-layer" id="hitLayer"></div></section>
  <section class="statline" id="statline"></section>
  <!-- #68: everything whose height varies from render to render (the
       advice, the prompt, the news, a pending sheet, the hand) lives inside
       this one fixed-height block instead of feeding layoutTable()'s old
       per-render "chrome" sum -- see app.js's layoutTable() for how its
       height is picked and why the map never reads anything from in here.
       #83: on desktop this is now the grid's own flexible row (desktop.css
       gives IT the `minmax(0, 1fr)` track, not #hand) -- #prompt/#sheet/
       #hand negotiate the row's real height amongst themselves with
       flexbox, same model mobile already used inside this same block, so
       #prompt (its own .prompt-scroll, style.css) is what gives/scrolls
       first, never #sheet or #hand pushing a sibling out of the sidebar. -->
  <div class="lowerBlock" id="lowerBlock">
    <section class="prompt" id="prompt">
      <!-- The advisor's banner (advisor-ui.js's placeBanner(), #68 addition
           to #69's original slot list) is inserted here, before
           #promptScroll, whenever it has something to say -- pinned above
           the scrolling text so a long prompt/news list scrolls under it
           without ever pushing it out of view (orchestrator's ruling on the
           owner's follow-up report, #68). -->
      <div class="prompt-scroll" id="promptScroll">
        <div class="prompt-text" id="promptText"></div>
        <!-- #53 round 2: a replaced bot move's own line (app.js's `game.fallbackNote`).
             A sibling of #promptText, not a child of it, on purpose -- the advisor
             (advisor-ui.js) used to hide #promptText outright in one of its own
             slots; #68 stopped that (the advice now sits beside the prompt, not
             instead of it), but this stays its own sibling regardless, since it
             is not the advisor's to touch either way. Hidden by default; app.js's
             renderLog() is the only thing that ever shows or fills it. -->
        <div class="prompt-fallback" id="fallbackBanner" hidden></div>
      </div>
    </section>
    <section class="sheet" id="sheet"></section>
    <section class="hand" id="hand"></section>
  </div>
  <form id="chatForm" class="chat" hidden><input id="chatIn" maxlength="200" autocomplete="off"><button type="submit" class="small" data-t="buttons.send"></button></form>
  <div id="logScrim" class="logscrim" hidden></div>
  <div id="logBody" class="logbody" hidden>
    <div class="logbody-head">
      <span class="logbody-title" id="logTitle"></span>
      <button type="button" id="logClose" class="small logbody-close no-tap-sound" data-t="buttons.hide"></button>
    </div>
    <div class="logbody-content" id="logLines"></div>
  </div>
</main>

<main id="over" class="view over-view" hidden>
  <div class="over-scroll">
    <div class="over-art">
      <img id="overImg" src="" alt="">
      <div class="over-shade" aria-hidden="true"></div>
      <div class="over-head">
        <span id="overGlyph" class="over-glyph" lang="zh-Hant"></span>
        <h1 class="over-h1">
          <span id="overReasonTitle" class="over-title" lang="zh-Hant"></span>
          <span id="overLine" class="over-line"></span>
        </h1>
      </div>
    </div>
    <div class="over-body">
      <p id="overBody" class="over-desc"></p>
      <div class="over-stats">
        <div><span id="overStatTurnLabel"></span><b id="overStatTurn"></b></div>
        <div><span id="overStatSealsLabel"></span><b id="overStatSeals"></b></div>
        <div><span id="overStatMieLabel"></span><b id="overStatMie"></b></div>
        <div><span id="overStatMandateLabel"></span><b id="overStatMandate"></b></div>
      </div>
    </div>
  </div>
  <div class="over-footer">
    <button id="btnAgain" class="primary" data-t="buttons.playAgain"></button>
    <div class="row">
      <button id="btnBoard" data-t="buttons.board"></button>
      <button id="btnSwap" data-t="buttons.swap"></button>
      <button id="btnHome" data-t="buttons.home"></button>
    </div>
  </div>
</main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
