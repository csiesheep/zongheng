  .rules { padding: 16px 14px 40px; max-width: 720px; margin: 0 auto; line-height: 1.7; }

  .rules h2 { font-family: var(--kai); font-weight: 400; letter-spacing: 3px; border-bottom: 1.5px solid var(--gold-line); padding-bottom: 4px; margin: 28px 0 10px; color: var(--gold); }
  .rules table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0; }
  .rules th, .rules td { border-bottom: 1px solid #4a4336; padding: 5px 6px; text-align: left; vertical-align: top; }
  .rules th { color: var(--gold); font-weight: 600; }
  .rules .q { color: var(--qin-text); } .rules .c { color: var(--chu-gold); } .rules .n { color: var(--gold); } .rules .s { color: #9fc9b8; }
