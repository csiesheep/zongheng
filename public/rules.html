  gtag('config', 'G-Q4VS3P3T58', { page_location: (function () {
    var ALLOW = ["lang", "from"];
    var u = new URL(location.href);
    var kept = new URLSearchParams();
    ALLOW.forEach(function (k) { if (u.searchParams.has(k)) kept.set(k, u.searchParams.get(k)); });
    var qs = kept.toString();
    return u.origin + u.pathname + (qs ? "?" + qs : "");
  })() });
</script>
